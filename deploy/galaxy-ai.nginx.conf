server {
    listen 443 ssl default_server;
    server_name 124.222.51.137;
    ssl_certificate /etc/nginx/galaxy-ai/server.crt;
    ssl_certificate_key /etc/nginx/galaxy-ai/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 2m;

    location ~ "^/api/v1/uploads/[0-9a-f-]{36}/content$" {
        client_max_body_size 256m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ "^/api/v1/storage/uploads/[0-9a-f-]{36}/content$" {
        client_max_body_size 0;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:18443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        # Infrastructure idle timeout; normal agent work has no per-turn deadline.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    location /downloads/ {
        alias /opt/galaxy-ai/releases/;
        autoindex off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment;
    }
}
