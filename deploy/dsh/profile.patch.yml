- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: tool-fs
  config:
    read: false
    readImage: false
    write: false
    edit: false
- id: llm-retry
  disabled: true
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW)
    maxTokens: !!js Number(process.env.DSH_MAX_TOKENS)
    models: !!js ([{id:process.env.DSH_MODEL_ID, contextWindow:Number(process.env.DSH_CONTEXT_WINDOW), maxTokens:Number(process.env.DSH_MAX_TOKENS)}])
    streamIdleTimeoutMs: 900000
- id: compaction-basic
  config:
    headroomTokens: 1024
    maxTokens: 1024
    retainRatio: 0.16
